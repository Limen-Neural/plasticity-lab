name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cache cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-0.20.2-musl

      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          DENY_VERSION=0.20.2
          ARCHIVE="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${ARCHIVE}" \
            | tar -xz -C /tmp
          install -m 755 "/tmp/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" \
            "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-deny"
          cargo deny --version

      - name: Check licenses and advisories
        # --locked is a global cargo-deny flag (before subcommand)
        run: cargo deny --locked check

      - name: Build
        run: cargo build --all-features

      - name: Test (no default features)
        run: cargo test --no-default-features

      - name: Test (default features)
        run: cargo test

      - name: Test (critic feature)
        run: cargo test --features critic

      - name: Test (all features)
        run: cargo test --all-features

      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Cache cargo-tarpaulin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-tarpaulin
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: ${{ runner.os }}-tarpaulin-0.31.3

      - name: Install cargo-tarpaulin
        if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --version 0.31.3

      - name: Generate coverage report
        run: cargo tarpaulin --all-features --all-targets --out xml --output-dir coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ./coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  msrv:
    name: MSRV (build & test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Toolchain version must match package.rust-version in Cargo.toml.
      - name: Install MSRV toolchain (1.98.1)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: "1.98.1"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      # Pinned explicitly (not the default/repo-pinned toolchain) so this job keeps
      # testing the declared MSRV even if rust-toolchain.toml advances later.
      - name: Build at MSRV
        run: cargo +1.98.1 build --locked --all-features

      - name: Test at MSRV
        run: cargo +1.98.1 test --locked --all-features
