name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # rustfmt output is OS-independent; run once on Linux to save runner minutes
      # (matches neuromod / axon-encoder).
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # cargo-deny is installed from the musl Linux binary; keep the license/
      # advisory gate on Linux only (same reason tarpaulin stays Linux-only).
      - name: Cache cargo-deny
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-0.20.2-musl

      - name: Install cargo-deny
        if: runner.os == 'Linux' && steps.cache-deny.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DENY_VERSION=0.20.2
          ARCHIVE="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${ARCHIVE}" \
            | tar -xz -C /tmp
          install -m 755 "/tmp/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" \
            "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-deny"
          cargo deny --version

      - name: Check licenses and advisories
        # --locked is a global cargo-deny flag (before subcommand)
        if: runner.os == 'Linux'
        run: cargo deny --locked check

      - name: Build
        run: cargo build --locked --all-features

      # Native CI covers default, no-default, critic-only, and combined
      # all-feature configurations. `--no-default-features` catches accidental
      # use of optional sister crates in the core API; `--features critic`
      # covers adapter drift without pulling in `wasm-js`. The dedicated
      # Browser WASM job separately checks `wasm-js`, `critic,wasm-js`, and
      # the enabled/disabled entropy feature tree.
      - name: Test (default features)
        run: cargo test --locked

      - name: Test (no default features)
        run: cargo test --locked --no-default-features

      - name: Test (critic feature)
        run: cargo test --locked --features critic

      - name: Test (all features)
        run: cargo test --locked --all-features

      - name: Docs
        if: runner.os == 'Linux'
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Verify publishable package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/package-target
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked --list --all-features
          cargo package --locked --all-features
          cargo publish --dry-run --locked --all-features
          # Test the archive Cargo actually prepared, outside the checkout.
          package_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir"' EXIT
          tar -xzf "$CARGO_TARGET_DIR"/package/plasticity-lab-*.crate -C "$package_dir"
          manifest="$(find "$package_dir" -mindepth 2 -maxdepth 2 -name Cargo.toml)"
          cargo test --locked --manifest-path "$manifest"
          cargo test --locked --all-features --manifest-path "$manifest"

      # cargo-tarpaulin relies on Linux ptrace; Codecov is already wired here —
      # do not duplicate the upload on macOS/Windows.
      - name: Cache cargo-tarpaulin
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-tarpaulin
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: ${{ runner.os }}-tarpaulin-0.31.3

      - name: Install cargo-tarpaulin
        if: runner.os == 'Linux' && steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --version 0.31.3

      - name: Generate coverage report
        if: runner.os == 'Linux'
        run: cargo tarpaulin --all-features --all-targets --out xml --output-dir coverage

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: ./coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  msrv:
    name: MSRV (build & test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Toolchain version must match package.rust-version in Cargo.toml.
      - name: Install MSRV toolchain (1.98.1)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: "1.98.1"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      # Pinned explicitly (not the default/repo-pinned toolchain) so this job keeps
      # testing the declared MSRV even if rust-toolchain.toml advances later.
      - name: Build at MSRV
        run: cargo +1.98.1 build --locked --all-features

      - name: Test at MSRV
        run: cargo +1.98.1 test --locked --all-features

  browser-wasm:
    name: Browser WASM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust 1.98.1 with the WASM target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned action
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-browser-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-browser-wasm-

      - name: Check browser WASM
        run: cargo +1.98.1 check --locked --target wasm32-unknown-unknown --no-default-features --features wasm-js

      - name: Check browser WASM with critic
        run: cargo +1.98.1 check --locked --target wasm32-unknown-unknown --no-default-features --features critic,wasm-js

      - name: Verify browser entropy feature is opt-in
        shell: bash
        run: |
          set -euo pipefail
          enabled="$(cargo +1.98.1 tree --locked --target wasm32-unknown-unknown --no-default-features --features wasm-js -e features -i getrandom)"
          disabled="$(cargo +1.98.1 tree --locked --target wasm32-unknown-unknown --no-default-features -e features -i getrandom)"

          grep -F 'getrandom feature "wasm_js"' <<<"${enabled}"
          if grep -F 'getrandom feature "wasm_js"' <<<"${disabled}"; then
            echo "getrandom/wasm_js must not be enabled without plasticity-lab/wasm-js" >&2
            exit 1
          fi
