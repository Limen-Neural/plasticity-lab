name: Linear release sync

# Marks the matching Linear release complete when a GitHub Release is
# published for this repo, so the "plasticity-lab" release pipeline in
# Linear (https://linear.app/rpd-34/pipeline/plasticity-lab/releases)
# doesn't have to be updated by hand after every publish.
#
# Uses Linear's own first-party action (github.com/linear/linear-release-action)
# rather than hand-rolled GraphQL: it already knows the right mutation shape
# and auth flow for a scheduled pipeline like this one.
#
# Also runnable manually (workflow_dispatch) against a specific tag, so it
# can be exercised once against a real (or throwaway) release before being
# trusted to run unattended.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag of the release to sync (e.g. v0.2.0)"
        required: true
      dry_run:
        description: "Resolve and verify the target release without completing it"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    name: Mark Linear release complete
    runs-on: ubuntu-latest
    steps:
      # Untrusted (a workflow_dispatch tag is caller-supplied) but only ever
      # passed through `env:` and read back as "$VAR", never interpolated
      # directly into a `run:` script via ${{ }} — see the repo's other
      # workflow-injection notes.
      - name: Determine target tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          DISPATCH_DRY_RUN: ${{ github.event.inputs.dry_run }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
            # A release-event tag_name is a Git tag and can't contain a
            # newline; a workflow_dispatch string input is unconstrained.
            # Reject anything that isn't a well-formed tag ref before it
            # ever reaches $GITHUB_OUTPUT, so a crafted multiline value
            # can't inject extra output records.
            if ! git check-ref-format "refs/tags/$tag"; then
              echo "::error::'$tag' is not a valid Git tag name." >&2
              exit 1
            fi
          else
            tag="$RELEASE_EVENT_TAG"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_DRY_RUN" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0 # linear-release-action wants commit history available
          persist-credentials: false

      # In dry-run mode the pinned Linear action intentionally emits
      # `release: null`: it logs the selected name/version but does not make
      # a release object or output URL available. That is the safe operator
      # preflight. A real completion then returns outputs, which must match
      # the expected pipeline before this workflow is accepted as successful.
      - name: Complete the matching Linear release
        id: complete_release
        uses: linear/linear-release-action@d4af10092984f9bc6d5efa075b242bdf01333463 # v0.18.0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          name: plasticity-lab
          version: ${{ steps.tag.outputs.version }}
          dry_run: ${{ steps.tag.outputs.dry_run }}

      - name: Verify completed Linear release
        if: steps.tag.outputs.dry_run != 'true'
        env:
          EXPECTED_NAME: plasticity-lab
          EXPECTED_VERSION: ${{ steps.tag.outputs.version }}
          EXPECTED_URL_PREFIX: https://linear.app/rpd-34/pipeline/plasticity-lab/release/
          RELEASE_NAME: ${{ steps.complete_release.outputs.release-name }}
          RELEASE_VERSION: ${{ steps.complete_release.outputs.release-version }}
          RELEASE_URL: ${{ steps.complete_release.outputs.release-url }}
        run: |
          set -euo pipefail
          test "$RELEASE_NAME" = "$EXPECTED_NAME"
          test "$RELEASE_VERSION" = "$EXPECTED_VERSION"
          case "$RELEASE_URL" in
            "$EXPECTED_URL_PREFIX"*) ;;
            *)
              echo "::error::Linear action completed an unexpected release URL: $RELEASE_URL" >&2
              exit 1
              ;;
          esac
