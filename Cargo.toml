[package]
name = "plasticity-lab"
version = "0.1.0"
edition = "2024"
description = "Reward-modulated SNN training/session orchestration loop above neuromod's plasticity primitives"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Limen-Neural/plasticity-lab"
readme = "README.md"
keywords = ["snn", "stdp", "plasticity", "neuromodulation", "reward-modulation"]
categories = ["science", "simulation"]
# Bounded below by the neuromod git dependency, which currently requires 1.97.1.
rust-version = "1.98.1"
# Repo-governance/CI/dev-environment files that a crates.io consumer never
# needs and that don't belong in the published package artifact (#68).
exclude = [
    ".codacy.yml",
    ".deepsource.toml",
    ".devcontainer/",
    ".devin/",
    ".github/",
    ".gitignore",
    "codecov.yml",
    "rust-toolchain.toml",
    "deny.toml",
    "AGENTS.md",
    "CLAUDE.md",
    "REVIEW.md",
    "RELEASE.md",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

# Git dependencies (track main until crates are published on crates.io).
# neuromod main uses norepinephrine (not cortisol); limbic-critic main emits
# ModulatorVector without a neuromod dependency — see src/bridge.rs.
neuromod = { git = "https://github.com/Limen-Neural/neuromod", branch = "main" }
limbic-critic = { git = "https://github.com/Limen-Neural/limbic-critic", branch = "main", optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = []
# Critic → neuromodulator bridge (src/bridge.rs). Named for the concrete
# capability it enables, not a vague "integration" bundle — see #67.
critic = ["dep:limbic-critic"]

[workspace]

[profile.dev]
# SNN simulation (LIF/Izhikevich integration, STDP) is numerically heavy enough
# that unoptimized debug builds make local test/dev iteration noticeably slow.
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
