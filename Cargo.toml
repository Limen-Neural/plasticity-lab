[package]
name = "plasticity-lab"
version = "0.2.1"
edition = "2024"
description = "Reward-modulated SNN training/session orchestration loop above neuromod's plasticity primitives"
license = "MIT OR Apache-2.0"
authors = ["Raul Cardenas Montoya <montoyaraul34@gmail.com>"]
repository = "https://github.com/Limen-Neural/plasticity-lab"
readme = "README.md"
keywords = ["snn", "stdp", "plasticity", "neuromodulation", "reward-modulation"]
categories = ["science", "simulation"]
# Matches the minimum supported Rust version of neuromod 0.6.0.
rust-version = "1.98.1"
# Only consumer-facing source, examples, and licensing belong in the archive.
include = [
    "/src/**",
    "/examples/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE-2.0",
    "/LICENSES/**",
    "/REUSE.toml",
]

# docs.rs does not enable optional features by default; without this, the
# `critic` feature's `bridge` module would be silently missing from the
# published docs.
[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
# Seeded replay: `train_step_with_rng` / `run_session_with_rng` take
# `&mut impl rand::Rng` and forward it to neuromod's caller-injected step.
# Same major as neuromod's `rand` so the traits line up.
rand = "0.10"

# Registry releases provide the seeded-step API and browser entropy feature.
neuromod = "0.6.0"
limbic-critic = { version = "0.3.0", optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = []
# Critic → neuromodulator bridge (src/bridge.rs). Named for the concrete
# capability it enables, not a vague "integration" bundle — see #67.
critic = ["dep:limbic-critic"]
# Browser and Web Worker entropy backend. This remains opt-in so non-Web
# WebAssembly and native consumers can select an appropriate backend themselves.
wasm-js = ["neuromod/wasm-js"]

[workspace]

[profile.dev]
# SNN simulation (LIF/Izhikevich integration, STDP) is numerically heavy enough
# that unoptimized debug builds make local test/dev iteration noticeably slow.
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
