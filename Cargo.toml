[package]
name = "plasticity-lab"
version = "0.1.0"
edition = "2024"
description = "Generic reward-modulated plasticity loops for spiking neural networks"
license = "MIT OR Apache-2.0"
# Bounded by the neuromod/axon-encoder git dependencies, which currently require 1.97.1.
rust-version = "1.97.1"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2.0"
rand = "0.10"

# Git dependencies (track main until crates are published on crates.io).
# neuromod main uses norepinephrine (not cortisol); limbic-critic main emits
# ModulatorVector without a neuromod dependency — see src/bridge.rs.
neuromod = { git = "https://github.com/Limen-Neural/neuromod", branch = "main" }
limbic-critic = { git = "https://github.com/Limen-Neural/limbic-critic", branch = "main", optional = true }
axon-encoder = { git = "https://github.com/Limen-Neural/axon-encoder", branch = "main", optional = true }

[features]
default = []
integration = ["dep:limbic-critic", "dep:axon-encoder"]

[workspace]

[profile.dev]
# SNN simulation (LIF/Izhikevich integration, STDP) is numerically heavy enough
# that unoptimized debug builds make local test/dev iteration noticeably slow.
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
